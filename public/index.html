<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok MP4 Converter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0B0F17;
      color: #F3F4F6;
      overflow-x: hidden;
    }

    /* Ambient Background Glows */
    .glow-cyan {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(37, 244, 238, 0.22) 0%, rgba(0,0,0,0) 70%);
      filter: blur(60px);
      z-index: 0;
      animation: float 8s ease-in-out infinite alternate;
    }

    .glow-pink {
      position: absolute;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(254, 44, 85, 0.22) 0%, rgba(0,0,0,0) 70%);
      filter: blur(60px);
      z-index: 0;
      animation: float 10s ease-in-out infinite alternate-reverse;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, 40px) scale(1.1); }
    }

    /* Glassmorphism Card */
    .glass-card {
      background: rgba(18, 24, 38, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    /* Gradient Border Input Focus */
    .input-wrapper {
      position: relative;
      border-radius: 1rem;
      background: linear-gradient(135deg, rgba(37, 244, 238, 0.2), rgba(254, 44, 85, 0.2));
      padding: 1px;
      transition: all 0.3s ease;
    }

    .input-wrapper:focus-within {
      box-shadow: 0 0 25px rgba(37, 244, 238, 0.35), 0 0 10px rgba(254, 44, 85, 0.25);
    }

    /* Animated Button */
    .btn-gradient {
      background: linear-gradient(90deg, #FE2C55 0%, #25F4EE 100%);
      background-size: 200% auto;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-gradient:hover {
      background-position: right center;
      box-shadow: 0 8px 25px rgba(254, 44, 85, 0.4);
      transform: translateY(-2px);
    }

    /* Loading Spinner */
    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #25F4EE;
      border-bottom-color: #FE2C55;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Shimmer Effect */
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    
    .animate-shimmer {
      background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center relative p-4">

  <!-- Ambient Glow Backgrounds -->
  <div class="glow-cyan top-10 left-10"></div>
  <div class="glow-pink bottom-10 right-10"></div>

  <main class="w-full max-w-2xl relative z-10 my-8">
    
    <!-- App Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center p-3 mb-4 rounded-2xl bg-white/5 border border-white/10 shadow-inner">
        <!-- TikTok SVG Logo -->
        <svg class="w-10 h-10" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M19.589 6.686a4.793 4.793 0 0 1-3.77-4.245V2h-3.445v13.672a2.896 2.896 0 0 1-2.901 2.88 2.893 2.893 0 0 1-2.892-2.88 2.893 2.893 0 0 1 2.892-2.88c.28 0 .548.04.802.115V9.412a6.31 6.31 0 0 0-.802-.052 6.338 6.338 0 0 0-6.337 6.338 6.338 6.338 0 0 0 6.337 6.338 6.338 6.338 0 0 0 6.338-6.338V9.034a8.211 8.211 0 0 0 4.887 1.571V7.16a4.78 4.78 0 0 1-1.109-.474z" fill="#FE2C55"/>
          <path d="M16.589 6.686a4.793 4.793 0 0 1-3.77-4.245V2h-1.000v13.672a2.896 2.896 0 0 1-2.901 2.88 2.893 2.893 0 0 1-2.892-2.88 2.893 2.893 0 0 1 2.892-2.88c.28 0 .548.04.802.115V9.412a6.31 6.31 0 0 0-.802-.052 6.338 6.338 0 0 0-6.337 6.338 6.338 6.338 0 0 0 6.337 6.338 6.338 6.338 0 0 0 6.338-6.338V9.034a8.211 8.211 0 0 0 4.887 1.571V7.16a4.78 4.78 0 0 1-1.891-.474z" fill="#25F4EE" opacity="0.8"/>
        </svg>
      </div>
      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white">
        TikTok <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#25F4EE] to-[#FE2C55]">MP4 Converter</span>
      </h1>
      <p class="text-gray-400 mt-2 text-sm sm:text-base">Paste any TikTok video or short link (vt.tiktok.com) to convert to MP4 instantly.</p>
    </div>

    <!-- Main Card -->
    <div class="glass-card rounded-3xl p-6 sm:p-8">
      
      <!-- Input Form -->
      <form id="convertForm" class="space-y-4">
        <div class="input-wrapper">
          <div class="flex items-center bg-[#111622] rounded-[0.95rem] px-4 py-2">
            <!-- Link SVG Icon -->
            <svg class="w-5 h-5 text-gray-400 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path>
            </svg>
            <input 
              type="text" 
              id="tiktokUrl" 
              placeholder="Paste TikTok video link here (https://vt.tiktok.com/...)" 
              required
              autocomplete="off"
              class="w-full bg-transparent border-none text-white placeholder-gray-500 focus:outline-none text-sm sm:text-base py-3"
            />
            <button 
              type="button" 
              id="clearBtn" 
              class="hidden text-gray-500 hover:text-white p-1 transition"
            >
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
          </div>
        </div>

        <button 
          type="submit" 
          id="submitBtn" 
          class="w-full btn-gradient text-white font-bold py-4 rounded-2xl flex items-center justify-center space-x-2 text-base shadow-lg cursor-pointer"
        >
          <!-- Download Icon -->
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
          </svg>
          <span>Convert Video</span>
        </button>
      </form>

      <!-- Skeleton Loading State -->
      <div id="skeleton" class="hidden mt-8 space-y-4">
        <div class="flex flex-col sm:flex-row gap-4 items-center bg-white/5 p-4 rounded-2xl animate-shimmer">
          <div class="w-24 h-32 bg-white/10 rounded-xl flex-shrink-0"></div>
          <div class="flex-1 w-full space-y-3">
            <div class="h-4 bg-white/10 rounded w-3/4"></div>
            <div class="h-3 bg-white/10 rounded w-1/2"></div>
            <div class="h-10 bg-white/10 rounded-xl w-full mt-4"></div>
          </div>
        </div>
      </div>

      <!-- Error Box -->
      <div id="errorBox" class="hidden mt-6 bg-red-500/10 border border-red-500/30 text-red-400 p-4 rounded-2xl flex items-center space-x-3">
        <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span id="errorMessage" class="text-sm">Something went wrong. Please check your link.</span>
      </div>

      <!-- Result Card -->
      <div id="resultCard" class="hidden mt-8 transition-all duration-500">
        <div class="bg-white/5 border border-white/10 rounded-2xl p-5 flex flex-col sm:flex-row gap-5 items-center">
          
          <!-- Cover Thumbnail -->
          <div class="relative w-full sm:w-32 h-44 rounded-xl overflow-hidden flex-shrink-0 bg-black/40 border border-white/10">
            <img id="videoCover" src="" alt="Cover" class="w-full h-full object-cover">
            <span id="videoDuration" class="absolute bottom-2 right-2 bg-black/80 text-xs text-white px-2 py-0.5 rounded-md font-mono">
              00:00
            </span>
          </div>

          <!-- Video Details -->
          <div class="flex-1 w-full flex flex-col justify-between self-stretch">
            <div>
              <div class="flex items-center space-x-2 text-xs font-semibold text-[#25F4EE] mb-1">
                <!-- User SVG Icon -->
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                <span id="videoAuthor">@username</span>
              </div>
              <h3 id="videoTitle" class="text-white font-semibold text-sm sm:text-base line-clamp-3 leading-snug">
                Video Description Title
              </h3>
            </div>

            <!-- Download Action -->
            <div class="mt-4 pt-3 border-t border-white/10">
              <a 
                id="downloadBtn" 
                href="#" 
                target="_blank"
                download="tiktok-video.mp4"
                class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold py-3 px-4 rounded-xl flex items-center justify-center space-x-2 transition shadow-lg text-sm"
              >
                <!-- Film SVG Icon -->
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4v16M17 4v16M3 8h18M3 16h18"></path></svg>
                <span>Download MP4 Video</span>
              </a>
            </div>
          </div>

        </div>
      </div>

    </div>

    <!-- Footer Notice -->
    <div class="flex items-center justify-center space-x-2 text-xs text-gray-500 mt-6">
      <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
      <span>No watermark extraction engine active. Fast & secure processing.</span>
    </div>

  </main>

  <script>
    const form = document.getElementById('convertForm');
    const input = document.getElementById('tiktokUrl');
    const clearBtn = document.getElementById('clearBtn');
    const submitBtn = document.getElementById('submitBtn');
    const skeleton = document.getElementById('skeleton');
    const errorBox = document.getElementById('errorBox');
    const errorMessage = document.getElementById('errorMessage');
    const resultCard = document.getElementById('resultCard');

    const videoCover = document.getElementById('videoCover');
    const videoDuration = document.getElementById('videoDuration');
    const videoAuthor = document.getElementById('videoAuthor');
    const videoTitle = document.getElementById('videoTitle');
    const downloadBtn = document.getElementById('downloadBtn');

    // Toggle clear button visibility
    input.addEventListener('input', () => {
      clearBtn.classList.toggle('hidden', !input.value);
    });

    clearBtn.addEventListener('click', () => {
      input.value = '';
      clearBtn.classList.add('hidden');
      input.focus();
    });

    // Handle Form Submit
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const url = input.value.trim();
      if (!url) return;

      // Reset UI state
      errorBox.classList.add('hidden');
      resultCard.classList.add('hidden');
      skeleton.classList.remove('hidden');

      // Loading state
      submitBtn.disabled = true;
      submitBtn.innerHTML = `
        <div class="spinner w-5 h-5"></div>
        <span>Converting...</span>
      `;

      try {
        const response = await fetch('/api/convert', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json' 
          },
          body: JSON.stringify({ url })
        });

        const data = await response.json();

        if (!data.success) {
          throw new Error(data.error || 'Failed to convert video.');
        }

        // Populate Video Card
        videoCover.src = data.cover;
        videoDuration.textContent = data.duration;
        videoAuthor.textContent = data.author;
        videoTitle.textContent = data.title;
        downloadBtn.href = data.downloadUrl;

        // Reveal Result
        resultCard.classList.remove('hidden');

      } catch (err) {
        errorMessage.textContent = err.message;
        errorBox.classList.remove('hidden');
      } finally {
        skeleton.classList.add('hidden');
        submitBtn.disabled = false;
        submitBtn.innerHTML = `
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
          <span>Convert Video</span>
        `;
      }
    });
  </script>
</body>
</html>
